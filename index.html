<style>
:root{
  --bg:#0a0a0a;
  --bg-2:#111;
  --bg-3:#161616;
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.14);
  --fg:#f5f5f5;
  --fg-2:#a8a8a8;
  --fg-3:#666;
  --accent:#ff5500;
  --accent-2:#ff8a3d;
  --accent-glow:rgba(255,85,0,.35);
  --mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans:"Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif:"Instrument Serif", "Times New Roman", serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-feature-settings:"ss01","ss02","cv01";-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;overflow-x:hidden}
body{cursor:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:none}
::selection{background:var(--accent);color:#000}

/* Custom cursor */
.cur-dot,.cur-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;
  will-change:transform;mix-blend-mode:difference}
.cur-dot{width:6px;height:6px;border-radius:50%;background:#fff;
  transform:translate(-50%,-50%)}
.cur-ring{width:36px;height:36px;border:1px solid rgba(255,255,255,.6);border-radius:50%;
  transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s,background .2s}
.cur-ring.is-link{width:60px;height:60px;background:var(--accent);border-color:var(--accent);
  mix-blend-mode:normal}
.cur-ring.is-drag{width:80px;height:80px;border-color:var(--accent);background:transparent;mix-blend-mode:normal}
.cur-label{position:fixed;top:0;left:0;pointer-events:none;z-index:10000;
  transform:translate(-50%,-50%);font:500 10px/1 var(--mono);text-transform:uppercase;
  letter-spacing:.08em;color:#000;mix-blend-mode:normal;opacity:0;transition:opacity .15s;
  background:var(--accent);padding:6px 8px;border-radius:99px;white-space:nowrap}
.cur-label.show{opacity:1}
@media (hover:none){body{cursor:auto}.cur-dot,.cur-ring,.cur-label{display:none}}

/* Layout */
.container{max-width:1440px;margin:0 auto;padding:0 32px}
@media (max-width:720px){.container{padding:0 20px}}

/* Top nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;
  padding:18px 32px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(10,10,10,.85),rgba(10,10,10,0));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.nav-brand{font:600 13px/1 var(--mono);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.nav-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 12px var(--accent-glow);animation:pulse 2s infinite ease-in-out}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
.nav-links{display:flex;gap:28px;font:500 12px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.nav-links a{color:var(--fg-2);transition:color .2s;position:relative}
.nav-links a:hover{color:var(--fg)}
.nav-links a .num{color:var(--fg-3);margin-right:6px}
.nav-cta{font:500 12px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;
  padding:10px 16px;border:1px solid var(--line-2);border-radius:99px;
  display:inline-flex;align-items:center;gap:8px;transition:all .2s}
.nav-cta:hover{background:var(--accent);color:#000;border-color:var(--accent)}
.nav-cta .ic{width:6px;height:6px;border-radius:50%;background:#3fdc6e;
  box-shadow:0 0 8px rgba(63,220,110,.6)}
.nav-cta:hover .ic{background:#000;box-shadow:none}
@media (max-width:760px){.nav-links{display:none}}

/* Sections */
section{position:relative;padding:120px 0;border-top:1px solid var(--line)}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:64px;gap:32px;flex-wrap:wrap}
.section-eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--fg-3);display:flex;align-items:center;gap:10px}
.section-eyebrow::before{content:"";width:24px;height:1px;background:var(--accent)}
.section-title{font-family:var(--sans);font-weight:500;font-size:clamp(40px,5vw,72px);
  line-height:.95;letter-spacing:-.03em;margin-top:18px;max-width:14ch;text-wrap:balance}
.section-title em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--fg-2)}
.section-meta{font:500 12px/1.6 var(--mono);color:var(--fg-3);text-align:right;
  letter-spacing:.04em}

/* Reveal animation */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.reveal-stagger>*{opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal-stagger.in>*{opacity:1;transform:none}
.reveal-stagger.in>*:nth-child(1){transition-delay:.05s}
.reveal-stagger.in>*:nth-child(2){transition-delay:.12s}
.reveal-stagger.in>*:nth-child(3){transition-delay:.19s}
.reveal-stagger.in>*:nth-child(4){transition-delay:.26s}
.reveal-stagger.in>*:nth-child(5){transition-delay:.33s}
.reveal-stagger.in>*:nth-child(6){transition-delay:.4s}

/* Noise overlay */
.noise{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.04;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay}

/* Grain scan */
.scan{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.4;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,0) 0,rgba(255,255,255,0) 2px,rgba(255,255,255,.012) 2px,rgba(255,255,255,.012) 3px)}
</style>
